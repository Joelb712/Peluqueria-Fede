
    {% extends 'Inicio/index.html' %}
    {% block content %}
        <h1>Agregar Producto</h1>
        <!-- <form method="post">
            {% csrf_token%}
            {{form.as_p}}
            <button type="submit">Guardar</button>
        </form>-->
        <div class="container d-flex justify-content-center mt-5">
            <div class="shadow p-4 bg-dark rounded" style="min-width: 80%;">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-add">Guardar</button>
                    <a class="btn btn-del" class="del" href="{% url 'listar_productos' %}" role="button">Cancelar</a>
                </form>
            </div>
        </div>
    {% endblock %}
