{% extends 'Inicio/index.html' %}

{% block extra_css %}{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header">
        <h2 class="text text-center">Eliminar</h2>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <p>Estas seguro que quieres eliminar al cliente "{{ Cliente.nombre_cliente }} {{ Cliente.apellido_cliente }}"</p>
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a class="btn btn-dark" href="{% url 'Lista'%}">Cancelar</a>
        </form>
    </div>
</div>

{% endblock %}
