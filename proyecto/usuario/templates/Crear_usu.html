{% extends 'Inicio/index.html' %}

{% block extra_css %}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="text text-center"> Crear Usuario</h2>
    </div>
    <div class="card-body">
        {{error}}
    <form method="POST">
        {% csrf_token %}
        <div class="input-group mb-3">
            {{form.as_p}}
        </div>
        <button type="submit" class="btn btn-success">Enviar</button>
    </form>
</div>
{% endblock %}
